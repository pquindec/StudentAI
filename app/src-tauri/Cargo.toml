[package]
name = "ai-study-assistant"
version = "0.1.0"
description = "AI Study Assistant — aplicación de escritorio"
authors = ["AI Study Assistant"]
license = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
# Selector nativo de archivos, abierto solo desde Rust (sin permisos JS de diálogo).
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["net", "process", "io-util", "time", "sync", "macros"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Grabación nativa (CoreAudio) y escritura WAV. Ambas Apache-2.0 (ADR-003, ADR-007).
cpal = "0.18"
hound = "3.5"
