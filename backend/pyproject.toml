[project]
name = "studyassistant-backend"
version = "0.1.0"
description = "Backend local de AI Study Assistant (FastAPI sobre Unix socket)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "pydantic>=2.11",
    "pypdfium2>=5.14.0",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "striprtf>=0.0.35",
    "charset-normalizer>=3.4",
    "sqlite-vec==0.1.9",
    "fsrs==6.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S108"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "striprtf.*"]
ignore_missing_imports = true
